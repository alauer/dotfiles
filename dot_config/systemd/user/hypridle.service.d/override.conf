[Service]
# Wait for the Hyprland IPC socket to exist before hypridle tries to
# connect. Without this, hypridle starts the moment graphical-session.target
# becomes active — but Hyprland's IPC socket doesn't exist yet at that
# point, so hypridle fails with "Couldn't connect to a wayland compositor"
# and eventually hits start-limit-hit (5s ceiling: 50 × 0.1s).
ExecStartPre=/bin/sh -c 'i=0; while [ "$i" -lt 50 ]; do [ -n "$HYPRLAND_INSTANCE_SIGNATURE" ] && [ -S "/run/user/1000/hypr/$HYPRLAND_INSTANCE_SIGNATURE/.socket.sock" ] && exit 0; i=$((i+1)); sleep 0.1; done; exit 1'