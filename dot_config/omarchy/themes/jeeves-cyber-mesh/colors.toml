# Visual mode: 1980s neon synthwave over a deep indigo substrate.
# Jeeves signature (imperial violet #a070ff) is preserved as the accent.
# Chromatic border sweeps magenta → cyan at 45° on focused windows.

mode = "dark"

# ─── Surfaces (indigo substrate, lifted from obsidian for synthwave open) ──
# Harmonized with the control-room wallpaper's purple/magenta atmosphere.
background         = "#1a0d2e"   # deep indigo — base window background
dark_background    = "#100722"   # deeper for modals / overlay wells
darker_background  = "#080414"   # deepest for tooltips / menus
lighter_background = "#2a1d4a"   # lifted panel (slight magenta bias for warmth)

# ─── Foregrounds (pale violet-white, harmonized to new indigo base) ─────────
foreground         = "#f4e8ff"   # body text — 15.75:1 (AAA)
dark_foreground    = "#a89cc4"   # muted / disabled — 7.22:1 (AAA)
light_foreground   = "#e0d4f5"   # secondary text
bright_foreground  = "#fff4ff"   # emphasis / headings

# ─── Accent system (Jeeves signature preserved) ────────────────────────────
accent             = "#a070ff"   # imperial violet — Jeeves signature signal (5.45:1, AA)
selection          = "#2a1454"   # deep magenta-violet selection
muted              = "#1f1535"   # borders, dividers

# ─── Status colors (synthwave neon — promoted to high visibility) ──────────
red                = "#ff3d6e"   # failure / destructive
yellow             = "#ffd63d"   # warnings — sun-yellow, neon
green              = "#3dffb3"   # success — hot mint
cyan               = "#3df0ff"   # ★ electric cyan — telemetry, focus, active (13.42:1, AAA)
blue               = "#5d7dff"   # info — electric blue
magenta            = "#ff3df0"   # hot neon magenta (6.36:1, AA)
brown              = "#7a5a3a"   # reserved

# Bright variants — slight lift on lightness for emphasis roles
bright_red         = "#ff7a9e"
bright_yellow      = "#ffea7a"
bright_green       = "#7affd0"
bright_cyan        = "#7df5ff"
bright_blue        = "#9ab0ff"
bright_magenta     = "#ff7df5"

# ─── Chromatic gradient window borders ──────────────────────────────────────
# Active border sweeps magenta → cyan at 45° (iconic synthwave diagonal).
# Driven through Omarchy's hypr_gradient helper, picked up by both Hyprland
# borders and the Quickshell shell's active-border — single source of truth.
hyprland_active_border   = "rgba(ff3df0ee) rgba(3df0ffee) 45deg"
hyprland_inactive_border = "rgba(2a1f4acc)"
