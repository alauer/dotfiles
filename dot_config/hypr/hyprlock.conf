# Jeeves-themed hyprlock.conf — Phase 2e polish.
#
# Palette tokens grounded in:
#   /home/aaron/.local/share/plasma/desktoptheme/jeeves-after-dark/colors
#   /home/aaron/.local/share/plasma/look-and-feel/com.jeeves.afterdark/contents/lockscreen/
# Font: Hack (Hack/Bold/Italic/BoldItalic in /usr/share/fonts/TTF/) — already
# in the hyprland.lua fallback chain.
#
# Token map (RGB → plasma scheme key):
#   bg-deep    13, 9, 20   → [Colors:Window] BackgroundNormal
#   bg-plum    33, 21, 47  → [Colors:Header]  BackgroundNormal
#   fg-normal  243, 236, 255 → [Colors:Window] ForegroundNormal
#   fg-inactive 136, 120, 150 → [Colors:Window] ForegroundInactive
#   focus      169, 112, 255 → [Colors:Window] DecorationFocus
#   hover      214, 107, 255 → [Colors:Window] DecorationHover
#   positive   99, 230, 165  → [Colors:Window] ForegroundPositive
#   negative   255, 102, 133 → [Colors:Window] ForegroundNegative

$font = Hack

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# Solid Jeeves plum. Token: [Colors:Header] BackgroundNormal.
# `path` is omitted — hyprlock.md says "if path is empty or missing,
# will use color". The blur_passes is kept for future flexibility (e.g.
# switching to `path = screenshot` for a blurred-desktop background).
background {
    monitor =
    color = #21152f
    blur_passes = 3
}

# Time + date, top-right (matches the Jeeves LockScreenUi.qml layout).
# Token: fg-normal for time, fg-inactive for date.
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = rgb(243, 236, 255)
    position = -30, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    font_family = $font
    color = rgba(136, 120, 150, 0.85)
    position = -30, -150
    halign = right
    valign = top
}

# Pillow-style password input — Jeeves purple focus, plum fill.
# Gradient stops use rgba(HEXHEXHEXHEX) form (no commas, no internal
# whitespace) per the hyprlock.md input-field example. The gradient parser
# splits each line on whitespace; comma-decimals break into three tokens
# and fall back to solid color rendering of the first stop.
input-field {
    monitor =
    size = 30%, 5%
    outline_thickness = 3
    inner_color = rgba(0d091499)
    outer_color = rgba(a970ffff) rgba(63e6a5ff) 45deg
    check_color = rgba(63e6a5ff) rgba(d66bffff) 120deg
    fail_color = rgba(ff6685ff) rgba(a970ffff) 40deg
    font_color = rgb(243, 236, 255)
    fade_on_empty = false
    rounding = 26
    font_family = $font
    placeholder_text = <i>Input password…</i>
    fail_text = $PAMFAIL
    dots_size = 0.4
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}