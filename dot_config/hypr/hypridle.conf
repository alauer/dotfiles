general {
    # Phase R: route hypridle's idle-driven lock through the omarchy-cmd-lock
    # wrapper (the same chokepoint SUPER+L uses) so manual and walk-away
    # paths share the same code path. The wrapper execs hyprlock, which
    # self-engages session-lock-v1 with Hyprland.
    lock_cmd = omarchy-cmd-lock
    # before_sleep_cmd: engage the lock before sleep. Backgrounded so it
    # doesn't block sleep. omarchy-cmd-lock execs hyprlock; the wrapper's
    # `pidof hyprlock` short-circuit makes this a no-op when already locked.
    before_sleep_cmd = omarchy-cmd-lock &
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Idle lock chain (Phase R):
#   - listener @ 60s: walk-away auto-lock. Routed through omarchy-cmd-lock
#     wrapper (single chokepoint for manual and walk-away paths).
#   - listener @ 300s: 5-min idle suspend. systemctl suspend is the
#     canonical example from hypridle.md. The condition_cmd defers suspend
#     if an SSH session is active (so a remote admin isn't disconnected
#     by the laptop sleeping); condition_retry re-checks every 30s while
#     still idle. on-resume=true re-arms after wake (keeps walk-away
#     safety sticky).
listener {
    timeout = 60
    on-timeout = omarchy-cmd-lock
    on-resume = true
}

listener {
    timeout = 300
    on-timeout = systemctl suspend
    on-resume = true
    condition_cmd = ~/.local/bin/can-suspend.sh
    condition_retry = 30
}