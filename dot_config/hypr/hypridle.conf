general {
    # Phase R: route hypridle's idle-driven lock through the omarchy-cmd-lock
    # wrapper (the same chokepoint SUPER+L uses) so manual and walk-away
    # paths share the same code path. The wrapper execs hyprlock, which
    # self-engages session-lock-v1 with Hyprland.
    lock_cmd = omarchy-cmd-lock
    # before_sleep_cmd unchanged from Phase 1: loginctl lock-session.
    # This path is broken on this system because sddm-helper is the session
    # leader and does not forward the Lock signal to Hyprland. Suspend-lock
    # is a known gap, deferred to a follow-up phase.
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Idle lock chain (Phase R):
#   - listener @ 60s: walk-away auto-lock. Routed through omarchy-cmd-lock
#     wrapper (single chokepoint for manual and walk-away paths). The wrapper
#     has a LockedHint short-circuit so re-firing (e.g., listener fires
#     while hyprlock is already up) is a no-op.
listener {
    timeout = 60
    on-timeout = omarchy-cmd-lock
    on-resume = true
}