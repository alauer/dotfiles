# ─────────────────────────────────────────────────────────────────
#  hypridle — Jeeves Cyber Mesh progressive idle behavior
# ─────────────────────────────────────────────────────────────────
#
#  5 min idle  → dim Philips 346P1C to 30% brightness via DDC/CI
#  15 min idle → DPMS off (full display power save)
#  Resume      → restore brightness to 100% and DPMS on
#
#  DDC dim is per-monitor. If other monitors are added later,
#  their own `ddcutil setvcp 10 ...` calls need to be appended.

general {
    lock_cmd         = pidof hyprlock || loginctl lock-session
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# 5 min idle → backlight dim (content stays readable, monitor stays on)
listener {
    timeout    = 300
    on-timeout = ddcutil setvcp 10 30
    on-resume  = ddcutil setvcp 10 100
}

# 15 min idle → full DPMS off
listener {
    timeout    = 900
    on-timeout = hyprctl dispatch dpms off
    # on-resume: wake screen AND lock the session — cover the case where
    # the earlier shell.json idle-lock (at 300s) was dismissed or didn't
    # fire for any reason. Forces a fresh login every time the monitor
    # comes back from full power-save.
    on-resume  = sh -c 'hyprctl dispatch dpms on && loginctl lock-session'
}
